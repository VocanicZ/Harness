<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Harness logo">
  <title>Harness</title>
  <g fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round">
    <!-- straps: orchestrator hub -> pool workers -->
    <line x1="100" y1="100" x2="170" y2="100"/>
    <line x1="100" y1="100" x2="135" y2="39.4"/>
    <line x1="100" y1="100" x2="65"  y2="39.4"/>
    <line x1="100" y1="100" x2="30"  y2="100"/>
    <line x1="100" y1="100" x2="65"  y2="160.6"/>
    <line x1="100" y1="100" x2="135" y2="160.6"/>
  </g>
  <g fill="#1e293b">
    <!-- pool worker nodes -->
    <circle cx="170" cy="100"   r="11"/>
    <circle cx="135" cy="39.4"  r="11"/>
    <circle cx="65"  cy="39.4"  r="11"/>
    <circle cx="30"  cy="100"   r="11"/>
    <circle cx="65"  cy="160.6" r="11"/>
    <circle cx="135" cy="160.6" r="11"/>
  </g>
  <!-- hub buckle / orchestrator -->
  <circle cx="100" cy="100" r="16" fill="#fff" stroke="#1e293b" stroke-width="9"/>
</svg>
