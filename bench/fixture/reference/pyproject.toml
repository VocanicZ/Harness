[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pennywise"
version = "1.0.0"
description = "Read a plain text money ledger and say where the money went."
requires-python = ">=3.9"

[project.scripts]
pennywise = "pennywise.cli:main"

[tool.setuptools]
packages = ["pennywise"]
